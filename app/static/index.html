<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynaClock</title><style>:root{--bg:#f4f9fc;--panel:rgba(255,255,255,.94);--line:#d2e1eb;--text:#173a54;--muted:#637d8d;--brand:#0068b0;--brand-deep:#084e79;--gold:#bd8a32;--wash:#e8f3fa}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(rgba(244,249,252,.38),rgba(244,249,252,.38)),url("/static/cfjt-background.jpg") center/cover fixed;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
.shell{height:100vh;padding:2vh 3vw;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:1.2vh}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(255,255,255,.97);border:1px solid #e2d5b8;border-radius:18px;padding:1vh 1.6vw;box-shadow:0 5px 22px #28546d12}.brand-area{justify-self:start}
.brand-logo{display:block;width:clamp(190px,25vw,330px);height:auto;max-height:9vh;object-fit:contain;object-position:left center}
.clock{justify-self:center;text-align:center;font-size:clamp(72px,8.2vw,132px);font-weight:300;letter-spacing:-.055em;line-height:.9;color:var(--text)}
.dates{justify-self:end;text-align:right}
.hebrew{font-size:clamp(22px,2.3vw,38px);direction:rtl;color:var(--brand-deep)}
.civil,.event{color:var(--muted);font-size:clamp(14px,1.2vw,21px);margin-top:7px}
.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:1.4vw;min-height:0}
.panel{position:relative;background:var(--panel);border:1px solid #e2d5b8;border-radius:20px;padding:2vh 1.8vw;box-shadow:inset 0 0 0 1px #ffffff,0 5px 22px #28546d12}.panel::before,.panel::after{content:'';position:absolute;width:16px;height:16px;border-color:rgba(189,138,50,.5);border-style:solid;pointer-events:none}.panel::before{left:9px;top:9px;border-width:1px 0 0 1px;border-top-left-radius:6px}.panel::after{right:9px;bottom:9px;border-width:0 1px 1px 0;border-bottom-right-radius:6px}.poster-panel{padding:1vh .8vw;overflow:hidden}.poster-display{height:100%;min-height:0;display:grid;place-items:center}.poster-display img{display:block;width:100%;height:100%;max-width:100%;max-height:none;object-fit:cover;object-position:center bottom;border-radius:12px;box-shadow:0 5px 18px #163b5c24}.poster-display img[hidden]{display:none}.poster-empty{max-width:80%;text-align:center;color:var(--muted);font-size:clamp(17px,1.6vw,25px);line-height:1.45}
.label{color:var(--brand);font-size:clamp(12px,.95vw,16px);font-weight:750;text-transform:uppercase;letter-spacing:.12em;margin-bottom:1.2vh}
.event-panel{display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
.next{flex:1;min-height:0;display:grid;align-content:center;justify-items:center;text-align:center}
.next-name{font-size:clamp(28px,3.2vw,54px)}
.next-time{font-size:clamp(56px,6vw,96px);font-weight:700;color:var(--brand);line-height:1.05}
.countdown{color:var(--muted);font-size:clamp(15px,1.3vw,23px)}
.upcoming{border-top:1px solid var(--line);padding-top:1.2vh;margin-top:1vh}
.upcoming .label{margin-bottom:.6vh}
.upcoming-list{display:grid;gap:.3vh}
.upcoming-event{display:grid;grid-template-columns:5.6em 5.2em minmax(0,1fr);align-items:center;gap:.45em;padding:.35vh 0;border-bottom:1px solid #e8eff4;font-size:clamp(14px,1.15vw,20px)}
.upcoming-day{color:var(--muted);font-size:.85em}
.upcoming-time{color:var(--brand);font-size:1.25em;font-weight:800;white-space:nowrap}
.upcoming-name{overflow-wrap:anywhere}
.upcoming-empty{color:var(--muted);font-size:clamp(14px,1.1vw,19px)}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}
.copy{font-size:clamp(15px,1.15vw,20px);line-height:1.42}
.source{color:var(--muted);font-size:.82em}
.zmanbar{display:flex;justify-content:space-around;gap:12px;border-top:1px solid var(--line);padding-top:1.2vh}
.z{text-align:center;min-width:90px}
.z b{display:block;color:var(--brand);font-size:clamp(17px,1.45vw,25px)}
.z span{font-size:clamp(11px,.9vw,15px);direction:rtl;color:var(--muted)}
.status{position:fixed;right:14px;bottom:12px;color:#57798d;font-size:11px;z-index:30}
.progress-track{position:fixed;left:0;right:0;bottom:0;height:5px;background:#d7eaf4;z-index:40;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--gold);transition:width linear}
.halakha-copy{direction:rtl;text-align:right;unicode-bidi:plaintext}
.slide{position:fixed;inset:0;background:var(--bg);display:none;z-index:10;padding:7vh 8vw}
.slide.on{display:grid;place-content:center;text-align:center}
.slide img.media-photo{max-width:100%;max-height:86vh;object-fit:contain;border-radius:10px}
.slide h1{font-size:clamp(48px,6vw,96px);font-weight:400;color:var(--brand);margin:0 0 3vh}
.slide p{font-size:clamp(25px,2.7vw,46px);line-height:1.45;white-space:pre-wrap;max-width:1200px;margin:auto}
@media(max-width:800px){body{overflow:auto}.shell{height:auto;min-height:100vh}.grid,.bottom{grid-template-columns:1fr}.top{grid-template-columns:1fr 1fr;row-gap:10px}.brand-area{grid-column:1;grid-row:1}.brand-logo{width:min(220px,48vw);max-height:none}.clock{grid-column:1/-1;grid-row:2;font-size:clamp(64px,15vw,96px);margin:6px 0;text-align:center}.dates{grid-column:2;grid-row:1;text-align:right;margin:0}.event-panel{min-height:380px}.poster-display{height:72vh}.poster-display img{height:72vh;max-height:72vh}.zmanbar{flex-wrap:wrap}.upcoming-event{grid-template-columns:5.5em 4.7em minmax(0,1fr);font-size:15px}}
@media(min-width:801px) and (max-height:720px){.clock{font-size:clamp(64px,6.8vw,100px)}.panel{padding:1.2vh 1.4vw}.upcoming-event{padding:.15vh 0}}
</style></head><body><div class="shell"><div class="top"><div class="brand-area"><img class="brand-logo" src="/static/cfjt-logo.png" alt="Centre Français du Judaïsme Tunisien"></div><div class="clock" id="clock">--:--</div><div class="dates"><div class="hebrew" id="hdate">טוען…</div><div class="civil" id="cdate"></div><div class="event" id="event"></div></div></div><div class="grid"><section class="panel poster-panel"><div class="poster-display"><div id="posterEmpty" class="poster-empty">Affiche de Chabbat à sélectionner dans l’administration.</div><img id="shabbatPosterImage" alt="Affiche de Chabbat sélectionnée" hidden></div></section><section class="panel event-panel"><div class="next"><div class="label">Prochain événement</div><div class="next-name" id="nextName">—</div><div class="next-time" id="nextTime"></div><div class="countdown" id="countdown"></div></div><div class="upcoming"><div class="label">Puis cette semaine</div><div class="upcoming-list" id="upcomingEvents"></div></div></section></div><div class="bottom"><section class="panel"><div class="label">Halakha du jour</div><div class="copy halakha-copy" id="halakha">Aucune halakha programmée.</div><div class="source" id="source"></div></section><section class="panel"><div class="label">Informations</div><div class="copy" id="announcement">Bienvenue.</div></section></div><div class="zmanbar" id="zmanbar"></div></div><div class="status" id="status"></div><div class="slide" id="slide"><div id="slideBody"></div></div><div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div><script>
let off=0,data=null,rot=[],ri=0,timer=null,progressRaf=null,mediaRows=[];const $=s=>document.querySelector(s);function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function now(){return new Date(Date.now()+off)}function tick(){let n=now();$('#clock').textContent=n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});if(data?.next_prayer){let[h,m]=data.next_prayer.time.split(':').map(Number),t=new Date(n);t.setHours(h,m,0,0);let d=Math.max(0,t-n),mm=Math.floor(d/60000);$('#countdown').textContent=d?(mm>=60?`dans ${Math.floor(mm/60)}h${String(mm%60).padStart(2,'0')}`:`dans ${mm} min`):''}}setInterval(tick,1000);
function startProgress(seconds){cancelAnimationFrame(progressRaf);const bar=$('#progressFill');if(!seconds||seconds<=0){bar.style.transition='none';bar.style.width='0%';return}const started=performance.now(),duration=seconds*1000;function step(t){const p=Math.min(1,(t-started)/duration);bar.style.transition='none';bar.style.width=(p*100)+'%';if(p<1)progressRaf=requestAnimationFrame(step)}progressRaf=requestAnimationFrame(step)}
function scheduleMain(){clearTimeout(timer);$('#slide').classList.remove('on');if(!rot.length){startProgress(0);return}const seconds=data?.main_slide_seconds||30;startProgress(seconds);timer=setTimeout(showNextSlide,seconds*1000)}
function showNextSlide(){clearTimeout(timer);if(!rot.length){scheduleMain();return}let x=rot[ri++%rot.length];$('#slideBody').innerHTML=x.image_url?`<div><img class="media-photo" src="${esc(x.image_url)}" alt="${esc(x.title)}"></div>`:`<h1>${esc(x.title)}</h1><p>${esc(x.content)}</p>`;$('#slide').classList.add('on');const seconds=Math.max(5,Number(x.duration)||12);startProgress(seconds);timer=setTimeout(scheduleMain,seconds*1000)}
async function refresh(){try{let r=await fetch('/api/dashboard');if(!r.ok)throw Error();data=await r.json();off=new Date(data.server_time)-Date.now();$('#hdate').textContent=data.hebrew_date.hebrew||'';$('#cdate').textContent=new Date(data.server_time).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#event').textContent=data.calendar_event?.title||'';const selectedPoster=mediaRows.find(x=>String(x.id)===String(data.featured_shabbat_poster_id)),posterImage=$('#shabbatPosterImage'),posterEmpty=$('#posterEmpty');if(selectedPoster){if(posterImage.dataset.mediaId!==String(selectedPoster.id)){posterImage.src=selectedPoster.image_url;posterImage.dataset.mediaId=String(selectedPoster.id)}posterImage.hidden=false;posterEmpty.hidden=true}else{posterImage.hidden=true;posterImage.removeAttribute('src');delete posterImage.dataset.mediaId;posterEmpty.hidden=false}const week=data.week_program||[],dayNames=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'],todayTime=(String(data.server_time||'').match(/T(\d{2}:\d{2})/)||[])[1]||'00:00';let upcoming=[];week.forEach((d,i)=>{const date=new Date(d.date+'T12:00:00'),dayLabel=i===0?'Aujourd’hui':i===1?'Demain':dayNames[date.getDay()]+' '+d.date.slice(8,10)+'/'+d.date.slice(5,7);(d.events||[]).forEach(e=>{if(i>0||!e.time||e.time>todayTime)upcoming.push({day:dayLabel,time:e.time||'',name:e.name||''})})});if(data.next_prayer){const nextIndex=upcoming.findIndex(e=>e.day==='Aujourd’hui'&&e.time===data.next_prayer.time&&e.name===data.next_prayer.name);if(nextIndex>=0)upcoming.splice(nextIndex,1)}$('#upcomingEvents').innerHTML=upcoming.length?upcoming.slice(0,5).map(e=>'<div class="upcoming-event"><span class="upcoming-day">'+esc(e.day)+'</span><strong class="upcoming-time">'+esc(e.time)+'</strong><span class="upcoming-name">'+esc(e.name)+'</span></div>').join(''):'<div class="upcoming-empty">Aucun autre événement programmé cette semaine.</div>';$('#nextName').textContent=data.next_prayer?.name||'—';$('#nextTime').textContent=data.next_prayer?.time||'';$('#halakha').textContent=data.halakha?.content||'Aucune halakha programmée.';$('#source').textContent=data.halakha?.source?'Source : '+data.halakha.source:'';let cards=data.announcements.filter(a=>a.display_mode==='card');$('#announcement').innerHTML=cards.length?cards.slice(0,2).map(a=>'<strong>'+esc(a.title)+'</strong><br>'+esc(a.content)).join('<br><br>'):'Aucune annonce pour le moment.';$('#zmanbar').innerHTML=data.zmanim_strip.map(z=>'<div class="z"><span>'+esc(z.label)+'</span><b>'+z.time+'</b></div>').join('');$('#status').textContent=data.stale?'Données en cache':'';let nr=[...data.announcements.filter(a=>a.display_mode!=='card'),...mediaRows];if(JSON.stringify(nr.map(x=>[x.id,x.duration,x.image_url,x.title,x.content]))!==JSON.stringify(rot.map(x=>[x.id,x.duration,x.image_url,x.title,x.content]))){rot=nr;ri=0;scheduleMain()}tick()}catch{$('#status').textContent='Mode local — serveur en attente'}}async function refreshMedia(){try{const r=await fetch('/api/media/slides',{cache:'no-store'});if(r.ok){mediaRows=await r.json();await refresh()}}catch{}}
refresh();refreshMedia();setInterval(refresh,10000);setInterval(refreshMedia,60000);
</script></body></html>
