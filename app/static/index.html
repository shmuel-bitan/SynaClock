<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynaClock</title><style>
:root{--bg:#0b1110;--panel:#121b19;--line:#2a3935;--text:#f5f1e8;--muted:#aab6b1;--gold:#d4ba77}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}.shell{height:100vh;padding:2.8vh 3.6vw;display:grid;grid-template-rows:auto 1fr auto auto;gap:1.7vh}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:clamp(18px,1.6vw,30px);letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}.clock{font-size:clamp(70px,9vw,142px);font-weight:300;letter-spacing:-.055em;line-height:.9}.dates{text-align:right}.hebrew{font-size:clamp(22px,2.3vw,38px);direction:rtl}.civil,.event{color:var(--muted);font-size:clamp(14px,1.2vw,21px);margin-top:7px}.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:1.4vw;min-height:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:2vh 1.8vw}.label{color:var(--gold);font-size:clamp(12px,.95vw,16px);text-transform:uppercase;letter-spacing:.14em;margin-bottom:1.2vh}.prayer{display:grid;grid-template-columns:1fr auto;gap:20px;font-size:clamp(18px,1.75vw,31px);padding:.55vh 0;border-bottom:1px solid #26312f}.prayer small{grid-column:1/-1;color:var(--muted);font-size:.55em;margin-top:-5px}.next{height:100%;display:grid;place-content:center;text-align:center}.next-name{font-size:clamp(28px,3.2vw,54px)}.next-time{font-size:clamp(42px,4.7vw,74px);color:var(--gold)}.countdown{color:var(--muted);font-size:clamp(15px,1.3vw,23px)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}.copy{font-size:clamp(15px,1.15vw,20px);line-height:1.42}.source{color:var(--muted);font-size:.82em}.zmanbar{display:flex;justify-content:space-around;gap:12px;border-top:1px solid var(--line);padding-top:1.2vh}.z{text-align:center;min-width:90px}.z b{display:block;color:var(--gold);font-size:clamp(15px,1.25vw,22px)}.z span{font-size:clamp(11px,.9vw,15px);direction:rtl;color:var(--muted)}.status{position:fixed;right:14px;bottom:12px;color:#71807a;font-size:11px;z-index:30}.progress-track{position:fixed;left:0;right:0;bottom:0;height:5px;background:#26312f;z-index:40;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--gold);transition:width linear}.halakha-copy{direction:rtl;text-align:right;unicode-bidi:plaintext}.slide{position:fixed;inset:0;background:var(--bg);display:none;z-index:10;padding:7vh 8vw}.slide.on{display:grid;place-content:center;text-align:center}.slide h1{font-size:clamp(48px,6vw,96px);font-weight:400;color:var(--gold);margin:0 0 3vh}.slide p{font-size:clamp(25px,2.7vw,46px);line-height:1.45;white-space:pre-wrap;max-width:1200px;margin:auto}@media(max-width:800px){body{overflow:auto}.shell{height:auto;min-height:100vh}.grid,.bottom{grid-template-columns:1fr}.top{display:block}.dates{text-align:left;margin-top:15px}.zmanbar{flex-wrap:wrap}}
</style></head><body><div class="shell"><div class="top"><div><div class="brand" id="brand">SynaClock</div><div class="clock" id="clock">--:--</div></div><div class="dates"><div class="hebrew" id="hdate">טוען…</div><div class="civil" id="cdate"></div><div class="event" id="event"></div></div></div><div class="grid"><section class="panel"><div class="label">Programme du jour</div><div id="prayers"></div></section><section class="panel"><div class="next"><div class="label">Prochain événement</div><div class="next-name" id="nextName">—</div><div class="next-time" id="nextTime"></div><div class="countdown" id="countdown"></div></div></section></div><div class="bottom"><section class="panel"><div class="label">Halakha du jour</div><div class="copy halakha-copy" id="halakha">Aucune halakha programmée.</div><div class="source" id="source"></div></section><section class="panel"><div class="label">Informations</div><div class="copy" id="announcement">Bienvenue.</div></section></div><div class="zmanbar" id="zmanbar"></div></div><div class="status" id="status"></div><div class="slide" id="slide"><div id="slideBody"></div></div><div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div><script>
let off=0,data=null,rot=[],ri=0,timer=null,progressRaf=null;const $=s=>document.querySelector(s);function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function now(){return new Date(Date.now()+off)}function tick(){let n=now();$('#clock').textContent=n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});if(data?.next_prayer){let[h,m]=data.next_prayer.time.split(':').map(Number),t=new Date(n);t.setHours(h,m,0,0);let d=Math.max(0,t-n),mm=Math.floor(d/60000);$('#countdown').textContent=d?(mm>=60?`dans ${Math.floor(mm/60)}h${String(mm%60).padStart(2,'0')}`:`dans ${mm} min`):''}}setInterval(tick,1000);
function startProgress(seconds){cancelAnimationFrame(progressRaf);const bar=$('#progressFill');if(!seconds||seconds<=0){bar.style.transition='none';bar.style.width='0%';return}const started=performance.now(),duration=seconds*1000;function step(t){const p=Math.min(1,(t-started)/duration);bar.style.transition='none';bar.style.width=(p*100)+'%';if(p<1)progressRaf=requestAnimationFrame(step)}progressRaf=requestAnimationFrame(step)}
function scheduleMain(){clearTimeout(timer);$('#slide').classList.remove('on');if(!rot.length){startProgress(0);return}const seconds=data?.main_slide_seconds||30;startProgress(seconds);timer=setTimeout(showNextSlide,seconds*1000)}
function showNextSlide(){clearTimeout(timer);if(!rot.length){scheduleMain();return}let x=rot[ri++%rot.length];$('#slideBody').innerHTML=`<h1>${esc(x.title)}</h1><p>${esc(x.content)}</p>`;$('#slide').classList.add('on');const seconds=Math.max(5,Number(x.duration)||12);startProgress(seconds);timer=setTimeout(scheduleMain,seconds*1000)}
async function refresh(){try{let r=await fetch('/api/dashboard');if(!r.ok)throw Error();data=await r.json();off=new Date(data.server_time)-Date.now();$('#brand').textContent=data.config.synagogue_name||'SynaClock';$('#hdate').textContent=data.hebrew_date.hebrew||'';$('#cdate').textContent=new Date(data.server_time).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#event').textContent=data.calendar_event?.title||'';$('#prayers').innerHTML=data.prayers.length?data.prayers.map(p=>`<div class="prayer"><span>${esc(p.name)}</span><strong>${p.time?esc(p.time):''}</strong>${p.note?`<small>${esc(p.note)}</small>`:''}</div>`).join(''):'<div class="copy">Aucun événement programmé.</div>';$('#nextName').textContent=data.next_prayer?.name||'—';$('#nextTime').textContent=data.next_prayer?.time||'';$('#halakha').textContent=data.halakha?.content||'Aucune halakha programmée.';$('#source').textContent=data.halakha?.source?'Source : '+data.halakha.source:'';let cards=data.announcements.filter(a=>a.display_mode==='card');$('#announcement').innerHTML=cards.length?cards.slice(0,2).map(a=>`<strong>${esc(a.title)}</strong><br>${esc(a.content)}`).join('<br><br>'):'Aucune annonce pour le moment.';$('#zmanbar').innerHTML=data.zmanim_strip.map(z=>`<div class="z"><span>${esc(z.label)}</span><b>${z.time}</b></div>`).join('');$('#status').textContent=data.stale?'Données en cache':'';let nr=data.announcements.filter(a=>a.display_mode!=='card');if(JSON.stringify(nr.map(x=>[x.id,x.duration]))!==JSON.stringify(rot.map(x=>[x.id,x.duration]))){rot=nr;ri=0;scheduleMain()}tick()}catch{$('#status').textContent='Mode local — serveur en attente'}}refresh();setInterval(refresh,10000);
</script></body></html>
